<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen</title>
<script>
  // 首帧前确定主题，避免闪烁
  try {
    var pref = localStorage.getItem('lumen-theme') || 'system';
    var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Noto+Sans+SC:wght@300..700&display=swap" rel="stylesheet">
<style>
/* ---------- token：只改 --hue 和 --brand，灰阶跟着走 ---------- */
:root {
  color-scheme: light;
  --hue: 258;
  --chroma: .006;
  --brand: oklch(.52 .17 258);
  --on-brand: #fff;

  --surface-0: oklch(.965 var(--chroma) var(--hue));
  --surface-1: oklch(.98 var(--chroma) var(--hue));
  --surface-2: oklch(1 0 0);
  --fg: oklch(.22 var(--chroma) var(--hue));
  --fg-muted: oklch(.45 var(--chroma) var(--hue));
  --fg-subtle: oklch(.56 var(--chroma) var(--hue));
  --link: oklch(.5 .17 258);
  --hover: color-mix(in oklch, var(--fg) 6%, transparent);
  --hairline: color-mix(in oklch, var(--fg) 9%, transparent);
  --control-edge: color-mix(in oklch, var(--fg) 24%, transparent);
  --ring: color-mix(in oklch, var(--fg) 55%, transparent);
  --focus-halo: color-mix(in oklch, var(--brand) 16%, transparent);
  --danger-fg: oklch(.5 .18 27);
  --danger-bg: oklch(.96 .025 27);
  --success-fg: oklch(.5 .12 155);
  --warn-fg: oklch(.45 .09 70);
  --warn-bg: oklch(.95 .05 85);
  --toast-bg: oklch(.26 var(--chroma) var(--hue));
  --toast-fg: oklch(.97 var(--chroma) var(--hue));
  --toast-link: oklch(.82 .09 258);

  --shadow-1: 0 1px 2px rgb(0 0 0 / .06), 0 1px 1px rgb(0 0 0 / .04);
  --shadow-2: 0 2px 4px rgb(0 0 0 / .05), 0 8px 24px rgb(0 0 0 / .07);
  --shadow-3: 0 4px 8px rgb(0 0 0 / .08), 0 16px 48px rgb(0 0 0 / .16);
  --edge: inset 0 0 0 1px color-mix(in oklch, var(--fg) 7%, transparent);

  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --w-body: 400;
  --w-medium: 500;
  --w-bold: 600;
  --text-xs: .75rem;
  --text-sm: .8125rem;
  --text-md: .9375rem;
  --text-lg: 1.0625rem;
  --text-xl: 1.375rem;
  --leading-cjk: 1.75;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;

  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;

  --dur-instant: 100ms;
  --dur-quick: 180ms;
  --dur-base: 280ms;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-bounce: linear(0, 1.18 40%, .96 70%, 1);

  --z-sticky: 100;
  --z-overlay: 300;
  --z-toast: 500;
}
:root[data-theme=dark] {
  color-scheme: dark;
  --chroma: .005;
  --surface-0: oklch(.17 var(--chroma) var(--hue));
  --surface-1: oklch(.205 var(--chroma) var(--hue));
  --surface-2: oklch(.235 var(--chroma) var(--hue));
  --fg: oklch(.93 var(--chroma) var(--hue));
  --fg-muted: oklch(.72 var(--chroma) var(--hue));
  --fg-subtle: oklch(.6 var(--chroma) var(--hue));
  --link: oklch(.78 .1 258);
  --hover: color-mix(in oklch, var(--fg) 7%, transparent);
  --focus-halo: color-mix(in oklch, var(--brand) 30%, transparent);
  --danger-fg: oklch(.75 .13 25);
  --danger-bg: oklch(.27 .045 25);
  --success-fg: oklch(.76 .12 155);
  --warn-fg: oklch(.86 .09 85);
  --warn-bg: oklch(.3 .045 80);
  --toast-bg: oklch(.33 var(--chroma) var(--hue));
  --shadow-1: 0 1px 2px rgb(0 0 0 / .3);
  --shadow-2: 0 2px 4px rgb(0 0 0 / .25), 0 8px 24px rgb(0 0 0 / .35);
  --shadow-3: 0 4px 8px rgb(0 0 0 / .3), 0 16px 48px rgb(0 0 0 / .5);
  --edge: inset 0 0 0 1px rgb(255 255 255 / .06);
  /* 光渗效应：暗色字重降一档 */
  --w-body: 360;
  --w-medium: 460;
  --w-bold: 560;
}
@media (prefers-contrast: more) {
  :root, :root[data-theme=dark] {
    --hairline: color-mix(in oklch, var(--fg) 30%, transparent);
    --control-edge: color-mix(in oklch, var(--fg) 55%, transparent);
    --edge: inset 0 0 0 1px color-mix(in oklch, var(--fg) 30%, transparent);
  }
}

/* ---------- 基础 ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--surface-1);
  color: var(--fg);
  font: var(--w-body) var(--text-md) / var(--leading-cjk) var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-autospace: normal;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { text-wrap: balance; }
::placeholder { color: var(--fg-subtle); opacity: 1; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.i { width: 1em; height: 1em; flex: none; vertical-align: -0.125em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: 32px; padding: 0 var(--space-3);
  border: 0; border-radius: var(--radius-md);
  background: var(--surface-2); box-shadow: var(--edge), var(--shadow-1);
  font-size: var(--text-sm); font-weight: var(--w-medium); white-space: nowrap;
  transition: background-color var(--dur-instant), scale var(--dur-instant);
}
.btn:hover { background: color-mix(in oklch, var(--surface-2), var(--fg) 5%); }
.btn:active { scale: .98; }
.btn.primary { background: var(--brand); color: var(--on-brand); box-shadow: var(--shadow-1); }
.btn.primary:hover { background: color-mix(in oklch, var(--brand), black 10%); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--hover); }
.btn.danger { color: var(--danger-fg); }
.btn.sm { min-height: 28px; }
.btn.xs { min-height: 24px; padding: 0 var(--space-2); font-size: var(--text-xs); }
.btn[aria-disabled=true] { opacity: .6; cursor: progress; }
.icon-btn {
  display: inline-grid; place-items: center; width: 32px; height: 32px; flex: none;
  border: 0; border-radius: var(--radius-sm); background: transparent;
  color: var(--fg-muted); font-size: 1.0625rem;
  transition: background-color var(--dur-instant), color var(--dur-instant);
}
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.spin { width: 1em; height: 1em; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }

/* ---------- 布局 ---------- */
.app { display: flex; height: 100dvh; }
.sidebar {
  position: relative; flex: none; width: var(--side-w, 260px);
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: max(var(--space-3), env(safe-area-inset-top)) var(--space-2) max(var(--space-3), env(safe-area-inset-bottom));
  background: var(--surface-0); overflow: hidden;
}
.side-head { display: flex; align-items: center; gap: var(--space-2); min-height: 36px; padding: 0 var(--space-1) 0 var(--space-3); }
.brand { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-lg); font-weight: var(--w-bold); white-space: nowrap; }
.brand .i { color: var(--brand); }
.side-head .icon-btn { margin-left: auto; }
.new-chat { margin: 0 var(--space-1); justify-content: flex-start; min-height: 36px; }
.search { position: relative; margin: 0 var(--space-1); }
.search .i { position: absolute; left: var(--space-3); top: 50%; translate: 0 -50%; color: var(--fg-subtle); pointer-events: none; }
.search input { width: 100%; height: 34px; padding: 0 var(--space-3) 0 34px; border: 0; border-radius: var(--radius-md); background: var(--hover); outline: none; font-size: var(--text-sm); }
.search input:focus-visible { box-shadow: inset 0 0 0 1px var(--ring), 0 0 0 3px var(--focus-halo); }
.convs { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; margin: 0 calc(-1 * var(--space-2)); padding: 0 var(--space-2); }
.group-title { margin: var(--space-4) var(--space-3) var(--space-1); font-size: var(--text-xs); font-weight: var(--w-medium); color: var(--fg-subtle); }
.convs ul { list-style: none; margin: 0; padding: 0; }
.conv { position: relative; }
.conv-open {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%;
  padding: var(--space-2) 40px var(--space-2) var(--space-3);
  border: 0; border-radius: var(--radius-md); background: transparent; text-align: left;
  transition: background-color var(--dur-instant);
}
.conv-open:hover { background: var(--hover); }
.conv-open[aria-current=page] { background: var(--surface-2); box-shadow: var(--edge), var(--shadow-1); }
.conv-title { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-sm); }
.conv time { font-size: var(--text-xs); color: var(--fg-subtle); font-variant-numeric: tabular-nums; }
.conv-del { position: absolute; right: var(--space-1); top: 50%; translate: 0 -50%; opacity: 0; }
.conv:hover .conv-del, .conv:focus-within .conv-del { opacity: 1; }
@media (hover: none) { .conv-del { opacity: 1; } }
.list-empty { padding: var(--space-4) var(--space-3); font-size: var(--text-sm); color: var(--fg-muted); }
.list-empty p { margin: 0 0 var(--space-2); }

.side-foot { display: flex; flex-direction: column; gap: var(--space-1); }
.demo { font-size: var(--text-sm); }
.demo summary { display: flex; align-items: center; gap: var(--space-2); min-height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-md); color: var(--fg-muted); cursor: pointer; list-style: none; }
.demo summary::-webkit-details-marker { display: none; }
.demo summary::before { content: ''; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; rotate: -45deg; transition: rotate var(--dur-base) var(--ease-out); }
.demo[open] summary::before { rotate: 45deg; }
.demo summary:hover { background: var(--hover); color: var(--fg); }
.demo-body { display: grid; gap: 2px; padding: var(--space-1) var(--space-3) var(--space-2); }
.demo-body label { display: flex; align-items: center; gap: var(--space-2); min-height: 28px; cursor: pointer; }
.demo-body input { width: 16px; height: 16px; margin: 0; accent-color: var(--brand); }
.me { display: flex; align-items: center; gap: var(--space-3); width: 100%; padding: var(--space-2); border: 0; border-radius: var(--radius-md); background: transparent; text-align: left; }
.me:hover { background: var(--hover); }
.avatar { display: grid; place-items: center; width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--brand); color: var(--on-brand); font-size: var(--text-xs); font-weight: var(--w-bold); }
.me-text { display: grid; min-width: 0; line-height: 1.35; }
.me-name { font-size: var(--text-sm); font-weight: var(--w-medium); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-sub { font-size: var(--text-xs); color: var(--fg-muted); }

@media (min-width: 768px) {
  .sidebar[data-collapsed] .hide-collapsed { display: none; }
  .sidebar[data-collapsed] .side-head { justify-content: center; padding: 0; }
  .sidebar[data-collapsed] .side-head .icon-btn { margin: 0; }
  .sidebar[data-collapsed] .new-chat, .sidebar[data-collapsed] .me { justify-content: center; padding-inline: 0; }
  .sidebar[data-collapsed] .side-foot { margin-top: auto; }
}

.resizer { position: relative; z-index: var(--z-sticky); flex: none; width: 9px; margin: 0 -4px; cursor: col-resize; touch-action: none; }
.resizer::after { content: ''; position: absolute; inset: 0 3px; border-radius: 2px; transition: background-color var(--dur-quick); }
.resizer:hover::after, .resizer.dragging::after, .resizer:focus-visible::after { background: var(--ring); }
.resizer:focus-visible { outline: none; }

.main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--surface-1); }
.topbar { display: flex; align-items: center; gap: var(--space-2); flex: none; height: 52px; padding: 0 var(--space-4); }
.topbar h1 { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-md); font-weight: var(--w-medium); }
.top-actions { margin-left: auto; display: flex; gap: var(--space-1); }
.banner { display: flex; align-items: center; gap: var(--space-2); margin: 0 var(--space-4) var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--warn-bg); color: var(--warn-fg); font-size: var(--text-sm); }

/* ---------- 对话 ---------- */
.thread { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; overflow-anchor: auto; }
.col { max-width: 44rem; margin: 0 auto; padding: var(--space-2) var(--space-4) var(--space-8); }
.thread.is-empty .col { height: 100%; }
.msg { margin-block: var(--space-6); }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; }
.bubble { max-width: 85%; padding: var(--space-2) var(--space-4); border-radius: var(--radius-lg); background: var(--surface-2); box-shadow: var(--edge), var(--shadow-1); white-space: pre-wrap; overflow-wrap: anywhere; }
.pending { display: flex; align-items: center; gap: var(--space-1); margin: var(--space-1) 0 0; font-size: var(--text-xs); color: var(--fg-muted); }

.think { margin-bottom: var(--space-1); }
.think-toggle { display: inline-flex; align-items: center; gap: var(--space-1); margin-left: calc(-1 * var(--space-2)); padding: 2px var(--space-2); border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--fg-muted); font-size: var(--text-sm); }
.think-toggle:hover { background: var(--hover); color: var(--fg); }
.think-toggle .chev { transition: rotate var(--dur-base) var(--ease-out); }
.think-toggle[aria-expanded=true] .chev { rotate: 90deg; }
.think.active .think-label {
  background: linear-gradient(90deg, var(--fg-muted) 0 35%, var(--fg) 50%, var(--fg-muted) 65% 100%);
  background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 1.6s linear infinite;
}
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-base) var(--ease-out); }
.collapse.open { grid-template-rows: 1fr; }
.collapse > div { overflow: hidden; }
.think-body { margin: var(--space-1) 0 var(--space-3); padding-left: var(--space-3); box-shadow: inset 2px 0 0 var(--hairline); color: var(--fg-muted); font-size: var(--text-sm); }

.content p { margin: 0 0 var(--space-3); text-wrap: pretty; }
/* 流式输出时正文每帧都在变，pretty 会让前面几行反复重排；结束后再启用 */
.content[aria-busy=true] p { text-wrap: wrap; }
.content > :last-child { margin-bottom: 0; }
.content strong { font-weight: var(--w-bold); }
.content p code { padding: 1px 5px; border-radius: 5px; background: var(--surface-2); box-shadow: var(--edge); font: var(--text-sm) / 1 var(--font-mono); }
.ink { display: inline-block; animation: ink 140ms var(--ease-out) both; animation-delay: var(--d, 0ms); }
@keyframes ink { from { filter: blur(5px); opacity: 0; } to { filter: none; opacity: 1; } }
.caret { display: inline-block; width: .5em; height: .5em; margin-left: 3px; border-radius: 50%; background: var(--fg); vertical-align: .05em; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.code { margin: 0 0 var(--space-3); border-radius: var(--radius-md); background: var(--surface-2); box-shadow: var(--edge); overflow: hidden; }
.code-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-1) var(--space-1) var(--space-1) var(--space-3); box-shadow: inset 0 -1px 0 var(--hairline); color: var(--fg-muted); font: var(--text-xs) / 1.5 var(--font-mono); }
.code-head .btn { font-family: var(--font-sans); }
.code pre { margin: 0; padding: var(--space-3) var(--space-4); overflow-x: auto; font: var(--text-sm) / 1.65 var(--font-mono); }
.stopped { margin: var(--space-2) 0 0; font-size: var(--text-xs); color: var(--fg-muted); }
.msg-actions { display: flex; gap: 2px; margin: var(--space-1) 0 0 calc(-1 * var(--space-1)); opacity: 0; transition: opacity var(--dur-quick); }
.msg.ai:hover .msg-actions, .msg.ai:focus-within .msg-actions, .msg.ai:last-child .msg-actions { opacity: 1; }
@media (hover: none) { .msg-actions { opacity: 1; } }
.act .i { transform-origin: center; }
.act.liked { color: var(--link); }
.act.liked .i { fill: currentColor; }
.ok { color: var(--success-fg) !important; }
.msg-error { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) var(--space-3) var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--danger-bg); }
.msg-error > .i { margin-top: .3em; color: var(--danger-fg); }
.msg-error strong { display: block; color: var(--danger-fg); font-weight: var(--w-medium); }
.msg-error p { margin: 0; color: var(--fg-muted); font-size: var(--text-sm); }
.msg-error .btn { margin-left: auto; }

.empty { height: 100%; display: grid; place-content: center; justify-items: center; gap: var(--space-2); padding: var(--space-8) 0; text-align: center; }
.empty-mark { display: grid; place-items: center; width: 48px; height: 48px; margin-bottom: var(--space-2); border-radius: 14px; background: var(--surface-2); box-shadow: var(--edge), var(--shadow-1); color: var(--brand); font-size: 1.5rem; }
.empty h2 { margin: 0; font-size: var(--text-xl); font-weight: var(--w-bold); }
.empty p { margin: 0; color: var(--fg-muted); }
.suggests { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-2); margin-top: var(--space-4); }

.skel { display: grid; gap: var(--space-6); padding-top: var(--space-6); }
.sk-group { display: grid; gap: var(--space-3); }
.sk { height: 10px; border-radius: 5px; background: var(--hover); animation: sk 1.4s ease-in-out infinite; }
.sk-bubble { justify-self: end; width: 46%; height: 40px; border-radius: var(--radius-lg); }
.skel-hint { margin: 0; font-size: var(--text-sm); color: var(--fg-muted); }
@keyframes sk { 50% { opacity: .45; } }

/* ---------- 输入框 ---------- */
.composer-wrap { position: relative; flex: none; padding: 0 var(--space-4) max(var(--space-4), env(safe-area-inset-bottom)); }
.composer {
  max-width: 44rem; margin: 0 auto; padding: var(--space-3) var(--space-3) var(--space-2) var(--space-4);
  border-radius: var(--radius-xl); background: var(--surface-2); box-shadow: var(--edge), var(--shadow-2);
  transition: box-shadow var(--dur-quick) var(--ease-out);
}
/* 聚焦：双环加深，不用亮色描边 */
.composer:focus-within { box-shadow: inset 0 0 0 1px var(--ring), 0 0 0 4px var(--focus-halo), var(--shadow-2); }
.composer textarea { display: block; width: 100%; min-height: 1.75em; max-height: 40vh; padding: 0; border: 0; outline: none; resize: none; background: transparent; line-height: var(--leading-cjk); field-sizing: content; }
.composer-bar { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); }
.hint { font-size: var(--text-xs); color: var(--fg-subtle); }
.send { display: grid; place-items: center; width: 32px; height: 32px; margin-left: auto; border: 0; border-radius: var(--radius-sm); background: var(--fg); color: var(--surface-2); transition: opacity var(--dur-quick), scale var(--dur-instant); }
.send:active { scale: .94; }
.send[disabled] { opacity: .3; cursor: not-allowed; }
.to-bottom { position: absolute; left: 50%; bottom: calc(100% + var(--space-2)); z-index: var(--z-sticky); translate: -50% 0; border-radius: 999px; transition: opacity var(--dur-quick), translate var(--dur-base) var(--ease-out); }
@starting-style { .to-bottom { opacity: 0; translate: -50% 6px; } }

/* ---------- 轻提示 ---------- */
.toasts { position: fixed; top: 60px; left: 50%; z-index: var(--z-toast); translate: -50% 0; display: flex; flex-direction: column; align-items: center; gap: var(--space-2); pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: var(--space-2); min-height: 40px; padding: var(--space-1) var(--space-2) var(--space-1) var(--space-4);
  border-radius: var(--radius-md); background: var(--toast-bg); color: var(--toast-fg); box-shadow: var(--shadow-3);
  font-size: var(--text-sm); pointer-events: auto;
  transition: opacity var(--dur-quick), translate var(--dur-base) var(--ease-out);
}
@starting-style { .toast { opacity: 0; translate: 0 -8px; } }
.toast.leaving { opacity: 0; translate: 0 -4px; }
.toast > .i { color: var(--toast-link); }
.toast.success > .i { color: oklch(.8 .13 155); }
.toast > span { padding-right: var(--space-2); }
.toast-action { min-height: 28px; padding: 0 var(--space-2); border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--toast-link); font-weight: var(--w-medium); }
.toast-action:hover { background: rgb(255 255 255 / .08); }
.toast-action:focus-visible { outline-color: var(--toast-link); }

/* ---------- 设置弹窗 ---------- */
dialog {
  width: min(560px, calc(100vw - 32px)); max-height: min(720px, calc(100dvh - 32px));
  padding: 0; border: 0; border-radius: var(--radius-xl);
  background: var(--surface-2); color: var(--fg); box-shadow: var(--shadow-3), var(--edge); overflow: hidden;
  transition: opacity var(--dur-quick), scale var(--dur-base) var(--ease-out);
}
dialog[open] { display: flex; flex-direction: column; }
@starting-style { dialog[open] { opacity: 0; scale: .97; } }
dialog::backdrop { background: rgb(0 0 0 / .4); }
dialog form { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.dlg-head { display: flex; align-items: center; padding: var(--space-4) var(--space-3) var(--space-2) var(--space-6); }
.dlg-head h2 { margin: 0; font-size: var(--text-lg); font-weight: var(--w-bold); }
.dlg-head .icon-btn { margin-left: auto; }
.dlg-body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; padding: 0 var(--space-6) var(--space-4); }
.dlg-body h3 { margin: var(--space-4) 0 var(--space-3); font-size: var(--text-sm); font-weight: var(--w-medium); color: var(--fg-muted); }
.dlg-body section + section { margin-top: var(--space-6); }
.field { display: grid; gap: var(--space-1); margin-bottom: var(--space-4); }
.field label { font-size: var(--text-sm); font-weight: var(--w-medium); }
.opt { color: var(--fg-subtle); font-weight: var(--w-body); }
.input { height: 36px; padding: 0 var(--space-3); border: 0; border-radius: var(--radius-md); background: var(--surface-1); box-shadow: inset 0 0 0 1px var(--control-edge); transition: box-shadow var(--dur-quick); }
.input:hover { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--fg) 38%, transparent); }
.input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--ring), 0 0 0 4px var(--focus-halo); }
.input[aria-invalid=true] { box-shadow: inset 0 0 0 1px var(--danger-fg); }
.input[aria-invalid=true]:focus { box-shadow: inset 0 0 0 1px var(--danger-fg), 0 0 0 4px color-mix(in oklch, var(--danger-fg) 18%, transparent); }
.field .hint { margin: 0; color: var(--fg-muted); }
.err { display: flex; align-items: center; gap: var(--space-1); margin: 0; font-size: var(--text-xs); color: var(--danger-fg); }
.seg { margin: 0 0 var(--space-4); padding: 0; border: 0; }
.seg legend { margin-bottom: var(--space-1); padding: 0; font-size: var(--text-sm); font-weight: var(--w-medium); }
.seg-track { display: inline-flex; padding: 3px; border-radius: var(--radius-md); background: var(--surface-1); box-shadow: inset 0 0 0 1px var(--hairline); }
.seg label { position: relative; }
.seg input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
/* 嵌套圆角 = 外层 10px - 内边距 3px */
.seg span { display: block; padding: 3px var(--space-4); border-radius: calc(var(--radius-md) - 3px); color: var(--fg-muted); font-size: var(--text-sm); transition: background-color var(--dur-instant); }
.seg input:checked + span { background: var(--surface-2); color: var(--fg); box-shadow: var(--edge), var(--shadow-1); }
.seg input:focus-visible + span { outline: 2px solid var(--ring); outline-offset: 1px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
.switch-row label { display: grid; cursor: pointer; }
.switch-title { font-size: var(--text-sm); font-weight: var(--w-medium); }
.switch { appearance: none; position: relative; flex: none; width: 36px; height: 20px; margin: 0; border-radius: 10px; background: color-mix(in oklch, var(--fg) 30%, transparent); cursor: pointer; transition: background-color var(--dur-quick); }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-1); transition: translate var(--dur-base) var(--ease-bounce); }
.switch:checked { background: var(--brand); }
.switch:checked::after { translate: 16px 0; }
.kv { margin: 0; }
.kv div { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-2) 0; box-shadow: inset 0 -1px 0 var(--hairline); }
.kv div:last-child { box-shadow: none; }
.kv dt { font-size: var(--text-sm); color: var(--fg-muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.link { min-height: 24px; margin-left: var(--space-2); padding: 0 var(--space-1); border: 0; border-radius: 4px; background: transparent; color: var(--link); font-size: var(--text-sm); }
.form-alert { display: flex; align-items: flex-start; gap: var(--space-2); margin-top: var(--space-2); padding: var(--space-3); border-radius: var(--radius-md); background: var(--danger-bg); color: var(--danger-fg); font-size: var(--text-sm); }
.form-alert .i { margin-top: .3em; }
.dlg-foot { padding: var(--space-3) var(--space-6) var(--space-4); box-shadow: inset 0 1px 0 var(--hairline); }
.dlg-actions { display: flex; justify-content: flex-end; gap: var(--space-2); }
.discard { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); font-size: var(--text-sm); }
.discard span { margin-right: auto; }

/* ---------- 移动端：侧栏变抽屉 ---------- */
.scrim { position: fixed; inset: 0; z-index: calc(var(--z-overlay) - 1); background: rgb(0 0 0 / .35); }
@media (max-width: 767px) {
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: var(--z-overlay); width: min(300px, 85vw);
    translate: -100% 0; visibility: hidden; box-shadow: var(--shadow-3);
    transition: translate var(--dur-base) var(--ease-out), visibility 0s var(--dur-base);
  }
  .app.nav-open .sidebar { translate: 0 0; visibility: visible; transition-delay: 0s; }
  .resizer, .composer-bar .hint, .theme-text { display: none; }
  .topbar { padding: 0 var(--space-2); }
  .col { padding-inline: var(--space-3); }
  .composer-wrap { padding-inline: var(--space-2); }
}
@media (min-width: 768px) { .only-mobile, .scrim { display: none !important; } }

@media (pointer: coarse), (max-width: 40rem) {
  input:not([type="checkbox"]):not([type="radio"]), textarea, .composer textarea, select { font-size: max(1rem, 16px); }
}

/* ---------- 用户偏好 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
@media (prefers-reduced-transparency: reduce) {
  dialog::backdrop, .scrim { background: rgb(0 0 0 / .7); }
}
@media (forced-colors: active) {
  .composer, .bubble, .code, .btn, .input, .toast, dialog, .msg-error, .banner, .form-alert, .conv-open[aria-current=page], .seg input:checked + span, .switch { border: 1px solid CanvasText; }
  .switch::after { background: CanvasText; }
}

<script>
(() => {
  'use strict';

  const $ = (s, r = document) => r.querySelector(s);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const nf = new Intl.NumberFormat('zh-CN');
  const cny = new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY' });
  const MIN = 60e3, HOUR = 60 * MIN, DAY = 24 * HOUR;
  const NL = String.fromCharCode(10);
  const rand = n => Math.floor(Math.random() * n);
  let seq = 0;
  const uid = () => 'x' + (++seq);

  // 可被「停止」提前唤醒的等待
  function sleep(ms, ctl) {
    return new Promise(res => {
      const t = setTimeout(res, ms);
      if (ctl) ctl.wake = () => { clearTimeout(t); res(); };
    });
  }

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    el.append(...kids.flat().filter(x => x != null && x !== false));
    return el;
  }
  function icon(name, cls) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'i' + (cls ? ' ' + cls : ''));
    svg.setAttribute('aria-hidden', 'true');
    const use = document.createElementNS(ns, 'use');
    use.setAttribute('href', '#i-' + name);
    svg.append(use);
    return svg;
  }

  // 极简弹簧：每帧细分 4 步，stiffness 1200 时也稳定
  function spring({ from, to, k, c, precision = .3, onUpdate, onDone }) {
    if (reduceMotion.matches) { onUpdate(to); if (onDone) onDone(); return () => {}; }
    let x = from, v = 0, last = performance.now(), id;
    const step = now => {
      const dt = Math.min(.032, (now - last) / 1000) / 4;
      last = now;
      for (let i = 0; i < 4; i++) { v += (-k * (x - to) - c * v) * dt; x += v * dt; }
      if (Math.abs(v) < precision && Math.abs(x - to) < precision) { onUpdate(to); if (onDone) onDone(); return; }
      onUpdate(x);
      id = requestAnimationFrame(step);
    };
    id = requestAnimationFrame(step);
    return () => cancelAnimationFrame(id);
  }
  // 反馈类动作：欠阻尼，带一点回弹
  function pop(el, from = .6) {
    if (el._stop) el._stop();
    el._stop = spring({ from, to: 1, k: 500, c: 14, precision: .002, onUpdate: s => { el.style.scale = s; } });
  }

  // ---------- 时间与文案 ----------
  const pad = n => String(n).padStart(2, '0');
  function absTime(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function relTime(ts) {
    const diff = Date.now() - ts;
    if (diff < MIN) return '刚刚';
    if (diff < HOUR) return Math.floor(diff / MIN) + ' 分钟前';
    if (diff < DAY) return Math.floor(diff / HOUR) + ' 小时前';
    const full = absTime(ts);
    return new Date(ts).getFullYear() === new Date().getFullYear() ? full.slice(5) : full;
  }
  const timeEl = ts => h('time', { datetime: new Date(ts).toISOString(), title: absTime(ts) }, relTime(ts));
  const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
  function clip(s, n) {
    s = s.replace(/[*`]/g, '').trim();
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  // ---------- 模拟回复 ----------
  function parseInline(src) {
    const segs = [];
    let buf = '', strong = false, code = false;
    const flush = () => { if (buf) segs.push({ text: buf, strong, code }); buf = ''; };
    for (let i = 0; i < src.length; i++) {
      if (!code && src.startsWith('**', i)) { flush(); strong = !strong; i++; continue; }
      if (src[i] === '`') { flush(); code = !code; continue; }
      buf += src[i];
    }
    flush();
    return segs;
  }
  const P = src => ({ type: 'p', segs: parseInline(src) });
  const C = (lang, text) => ({ type: 'code', lang, text });

  const REPLIES = {

      blocks: [

[data-theme="dark"] { --w-body: 360; }

      ]

  };
  function pickReply(text) {
    if (/错误|报错|提示/.test(text)) return REPLIES.error;
    if (/字重|暗色|深色/.test(text)) return REPLIES.weight;
    if (/金额|表格|数字/.test(text)) return REPLIES.table;
    return {
      secs: 1.2,
      think: '用户的问题是「' + clip(text, 24) + '」。这是演示环境，没有接真实模型，给一段说明性的回复，同时展示流式效果。',
      blocks: [

  const state = {

  // ---------- 轻提示：带操作时停留 6 秒，悬停或聚焦时暂停 ----------
  function toast(text, { action, onAction, tone } = {}) {
    const el = h('div', { class: 'toast' + (tone ? ' ' + tone : '') }, icon(tone === 'success' ? 'check' : 'info'), h('span', null, text));
    let remain = action ? 6000 : 3000, start = 0, timer = 0, holds = 0, closed = false;
    const close = () => {
      if (closed) return;
      closed = true;
      clearTimeout(timer);
      el.classList.add('leaving');
      setTimeout(() => el.remove(), 220);
    };
    const run = () => { start = Date.now(); timer = setTimeout(close, remain); };
    const hold = () => { if (holds++ === 0) { clearTimeout(timer); remain -= Date.now() - start; } };
    const release = () => { if (--holds === 0) run(); };
    if (action) {
      const b = h('button', { class: 'toast-action', type: 'button' }, action);
      b.addEventListener('click', () => { onAction(); close(); });
      el.append(b);
    }
    el.addEventListener('mouseenter', hold);
    el.addEventListener('mouseleave', release);
    el.addEventListener('focusin', e => { if (!el.contains(e.relatedTarget)) hold(); });
    el.addEventListener('focusout', e => { if (!el.contains(e.relatedTarget)) release(); });
    toasts.append(el);
    run();
  }

  // ---------- 侧栏列表 ----------
  function convItem(c) {
    const open = h('button', { class: 'conv-open', type: 'button', 'aria-current': c.id === state.activeId ? 'page' : null }, h('span', { class: 'conv-title' }, c.title), timeEl(c.updated));
    open.addEventListener('click', () => openConv(c.id));
    const del = h('button', { class: 'icon-btn conv-del', type: 'button', 'aria-label': '删除对话「' + c.title + '」', title: '删除' }, icon('trash'));
    del.addEventListener('click', () => deleteConv(c));
    return h('li', { class: 'conv', 'data-id': c.id }, open, del);
  }
  function renderList() {
    const f = document.activeElement;
    const li = nav.contains(f) ? f.closest('.conv') : null;
    const keep = li ? { id: li.dataset.id, del: f.classList.contains('conv-del') } : null;
    const q = search.value.trim();
    const list = state.convs.filter(c => !q || c.title.includes(q)).sort((a, b) => b.updated - a.updated);
    const today = startOfToday();
    const groups = [['今天', []], ['昨天', []], ['更早', []]];
    for (const c of list) groups[c.updated >= today ? 0 : c.updated >= today - DAY ? 1 : 2][1].push(c);
    nav.replaceChildren();
    if (!list.length) {
      if (q) {
        const clear = h('button', { class: 'btn ghost sm', type: 'button' }, '清除搜索');
        clear.addEventListener('click', () => { search.value = ''; renderList(); search.focus(); });
        nav.append(h('div', { class: 'list-empty' }, h('p', null, '没有标题包含「' + q + '」的对话。'), clear));
      } else {

    groups.forEach(([name, items], i) => {

  // ---------- 对话区 ----------
  let stick = true;
  function updateToBottom() { toBottom.hidden = stick || thread.classList.contains('is-empty'); }
  thread.addEventListener('scroll', () => {

  }, { passive: true });
  // 只有用户停在底部时才跟随新内容
  function follow() { if (stick) thread.scrollTop = thread.scrollHeight; updateToBottom(); }

  function emptyState() {
    const asks = ['登录页的错误提示应该怎么写？', '暗色模式下字重为什么要调细？', '表格里的金额怎么对齐？'];

  function skeleton() {

  function userEl(m) {

  function codeEl(lang) {
    return h('div', { class: 'code' },

        h('button', { class: 'btn ghost xs code-copy', type: 'button' }, icon('copy'), h('span', null, '复制'))),

  function renderStatic(content, blocks) {

  const stoppedNote = () => h('p', { class: 'stopped' }, '已停止生成');

  function setThink(el, secs, active) {
    el.querySelector('.think').classList.toggle('active', active);

  function errorEl(m) {
    const retry = h('button', { class: 'btn sm', type: 'button' }, icon('refresh'), '重试');

    return h('div', { class: 'msg-error', role: 'alert' }, icon('alert'),
      h('div', null, h('strong', null, '回复生成失败'), h('p', null, '连接在生成前中断了。你的问题还在，可以直接重试。')),

  function actionsEl(m) {
    const copy = h('button', { class: 'icon-btn act', type: 'button', 'aria-label': '复制回复', title: '复制' }, icon('copy'));
    copy.addEventListener('click', () => {
      const c = m.el.querySelector('.content').cloneNode(true);
      c.querySelectorAll('.code-head, .stopped').forEach(n => n.remove());
      copyText([...c.children].map(n => n.textContent.trim()).join(NL + NL), copy);
    });
    const like = h('button', { class: 'icon-btn act' + (m.liked ? ' liked' : ''), type: 'button', 'aria-label': '赞', 'aria-pressed': String(!!m.liked), title: '赞' }, icon('thumb'));
    like.addEventListener('click', () => {
      m.liked = !m.liked;
      like.classList.toggle('liked', m.liked);
      like.setAttribute('aria-pressed', String(m.liked));
      if (m.liked) pop(like.querySelector('svg'));

    const regen = h('button', { class: 'icon-btn act', type: 'button', 'aria-label': '重新生成', title: '重新生成' }, icon('refresh'));
    regen.addEventListener('click', () => { if (!state.busy) startReply(activeConv(), m); });
    return h('div', { class: 'msg-actions' }, copy, like, regen);
  }

  function aiEl(m, live) {
    const toggle = h('button', { class: 'think-toggle', type: 'button', 'aria-expanded': 'false' }, icon('chevron', 'chev'), h('span', { class: 'think-label' }));
    const collapse = h('div', { class: 'collapse', inert: true }, h('div', null, h('div', { class: 'think-body' }, m.reply.think)));
    // 折叠展开：网格 0fr ↔ 1fr，不用 JS 算高度
    toggle.addEventListener('click', () => {
      const open = toggle.getAttribute('aria-expanded') !== 'true';
      toggle.setAttribute('aria-expanded', String(open));
      collapse.classList.toggle('open', open);
      collapse.inert = !open;
    });
    const content = h('div', { class: 'content' });
    const actions = actionsEl(m);
    const el = h('article', { class: 'msg ai', 'aria-label': 'Lumen 的回复' }, h('div', { class: 'think' }, toggle, collapse), content, actions);
    m.el = el;
    if (live) {
      setThink(el, 0, true);
      content.setAttribute('aria-busy', 'true');
      actions.hidden = true;
      return el;
    }
    setThink(el, m.thinkSecs || m.reply.secs, false);
    if (m.status === 'error') {
      content.append(errorEl(m));
      actions.hidden = true;
    } else {
      if (m.html != null) content.innerHTML = m.html;
      else renderStatic(content, m.reply.blocks);

  function renderThread() {
    const conv = activeConv();
    $('#convName').textContent = conv ? conv.title : '新对话';
    document.title = (conv ? conv.title + ' - ' : '') + 'Lumen';
    col.replaceChildren();

    thread.classList.toggle('is-empty', empty);
    if (empty) col.append(emptyState());
    else for (const m of conv.messages) col.append(m.role === 'user' ? userEl(m) : aiEl(m, false));

  // ---------- 复制：图标换成对勾并回弹，2.5 秒后恢复 ----------
  async function copyText(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const tmp = h('textarea');
      tmp.value = text;
      document.body.append(tmp);
      tmp.select();
      document.execCommand('copy');
      tmp.remove();
    }
    clearTimeout(btn._t);
    const use = btn.querySelector('use'), label = btn.querySelector('span');
    use.setAttribute('href', '#i-check');
    btn.classList.add('ok');
    if (label) label.textContent = '已复制'; else btn.setAttribute('aria-label', '已复制');
    pop(btn.querySelector('svg'), .4);
    announce('已复制到剪贴板');
    btn._t = setTimeout(() => {
      use.setAttribute('href', '#i-copy');
      btn.classList.remove('ok');
      if (label) label.textContent = '复制'; else btn.setAttribute('aria-label', '复制回复');
    }, 2500);
  }
  col.addEventListener('click', e => {
    const b = e.target.closest('.code-copy');
    if (b) copyText(b.closest('.code').querySelector('code').textContent, b);
  });

  // ---------- 生成 ----------
  async function startReply(conv, m) {
    const idx = m ? conv.messages.indexOf(m) : conv.messages.length;
    let asked = null;
    for (let i = idx - 1; i >= 0 && !asked; i--) if (conv.messages[i].role === 'user') asked = conv.messages[i];
    const reply = pickReply(asked ? asked.text : '');
    if (m) Object.assign(m, { reply, status: 'streaming', html: null, thinkSecs: null, liked: false });
    else { m = { id: uid(), role: 'ai', reply, status: 'streaming' }; conv.messages.push(m); }
    const old = m.el;
    const el = aiEl(m, true);
    if (conv.id === state.activeId) {
      if (old && old.isConnected) old.replaceWith(el); else col.append(el);
      stick = true;
      follow();
    }
    await generate(conv, m, el);
  }

  async function stream(content, blocks, ctl) {
    const caret = h('span', { class: 'caret', 'aria-hidden': 'true' });
    for (const b of blocks) {
      if (ctl.stopped) break;
      if (b.type === 'code') {
        // 代码块整段出现，不做逐字动画
        const blk = codeEl(b.lang), code = blk.querySelector('code');
        content.append(blk, caret);
        for (let i = 0; i < b.text.length && !ctl.stopped;) {
          const n = 6 + rand(10);
          code.append(b.text.slice(i, i + n));
          i += n;
          follow();
          await sleep(24, ctl);
        }
        continue;
      }
      const p = h('p');
      content.append(p);
      for (const s of b.segs) {
        if (ctl.stopped) break;
        // 先建好标签再填字，未闭合的 ** 和 ` 不会闪出原始符号
        const host = s.strong ? h('strong') : s.code ? h('code') : h('span', { class: 'stream-seg' });
        p.append(host, caret);
        for (let i = 0; i < s.text.length && !ctl.stopped;) {
          const chunk = s.text.slice(i, i + 1 + rand(3));
          i += chunk.length;
          [...chunk].forEach((ch, k) => host.append(ch === ' ' ? ' ' : h('span', { class: 'ink', style: '--d:' + k * 30 + 'ms' }, ch)));
          follow();
          await sleep(42, ctl);
        }
      }
    }
    caret.remove();
  }

  // 流式结束后把动画 span 换回纯文本
  function unwrap(content) {
    content.querySelectorAll('.ink').forEach(s => s.replaceWith(s.textContent));
    content.querySelectorAll('.stream-seg').forEach(s => s.replaceWith(...s.childNodes));
    content.normalize();
  }

  async function generate(conv, m, el) {
    const ctl = { stopped: false, conv };
    state.busy = ctl;
    syncComposer();
    const content = el.querySelector('.content'), actions = el.querySelector('.msg-actions');
    const num = el.querySelector('.think-label .num');
    const t0 = performance.now();
    const tick = setInterval(() => { num.textContent = ((performance.now() - t0) / 1000).toFixed(1); }, 100);
    await sleep(m.reply.secs * 1000, ctl);
    clearInterval(tick);
    m.thinkSecs = Math.max(.1, (performance.now() - t0) / 1000);
    setThink(el, m.thinkSecs, false);

    if (!ctl.stopped && flags.fail) {
      consumeFail();
      m.status = 'error';
      content.removeAttribute('aria-busy');
      content.append(errorEl(m));
      finish(ctl);
      return;
    }
    if (!ctl.stopped) {
      await stream(content, m.reply.blocks, ctl);
      if (!ctl.stopped) await sleep(260);
    }
    el.querySelectorAll('.caret').forEach(n => n.remove());
    unwrap(content);
    m.html = content.innerHTML;
    m.status = ctl.stopped ? 'stopped' : 'done';
    if (ctl.stopped) content.append(stoppedNote());
    content.removeAttribute('aria-busy');
    actions.hidden = false;
    conv.updated = Date.now();
    renderList();
    announce(ctl.stopped ? '已停止生成' : '回复已生成');
    finish(ctl);
  }
  function finish(ctl) {
    if (state.busy === ctl) state.busy = null;
    syncComposer();
    if (state.queue.length) flushQueue();
  }
  function stopGen() {
    const c = state.busy;
    if (!c) return;
    c.stopped = true;
    if (c.wake) c.wake();
  }

  // ---------- 输入框 ----------
  const nativeSizing = CSS.supports('field-sizing', 'content');
  function autosize() {
    if (nativeSizing) return;
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, innerHeight * .4) + 'px';
  }
  function syncComposer() {
    const busy = !!state.busy;
    sendBtn.disabled = !busy && !ta.value.trim();
    sendBtn.setAttribute('aria-label', busy ? '停止生成' : '发送');
    sendBtn.title = busy ? '停止生成' : '发送';
    sendBtn.querySelector('use').setAttribute('href', busy ? '#i-stop' : '#i-send');
  }
  function restoreDraft() {
    ta.value = state.drafts.get(draftKey()) || '';
    autosize();
    syncComposer();
  }
  ta.addEventListener('input', () => {
    autosize();
    syncComposer();
    state.drafts.set(draftKey(), ta.value);
  });
  ta.addEventListener('keydown', e => {
    // 输入法组词时按 Enter 是确认候选词，不能发送
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      if (!state.busy) form.requestSubmit();
    }
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (state.busy) stopGen(); else send(ta.value);
  });

  function send(raw) {
    const text = raw.trim();
    if (!text || state.busy) return;
    let conv = activeConv();
    const isNew = !conv;
    if (isNew) {
      conv = { id: uid(), title: clip(text, 18), updated: Date.now(), messages: [] };
      state.convs.unshift(conv);
      state.drafts.delete('new');
      state.activeId = conv.id;
    }
    const m = { id: uid(), role: 'user', text, pending: state.offline };
    conv.messages.push(m);
    conv.updated = Date.now();
    ta.value = '';
    state.drafts.delete(conv.id);
    autosize();
    syncComposer();
    if (isNew) renderThread(); else { col.append(userEl(m)); stick = true; follow(); }
    renderList();
    if (state.offline) {
      if (!state.queue.includes(conv)) state.queue.push(conv);
      announce('网络已断开，消息会在恢复后发送');
      return;
    }
    startReply(conv);
  }

  // ---------- 切换、新建、删除对话 ----------
  async function openConv(id) {
    closeNav();
    if (id === state.activeId) return;
    state.activeId = id;
    renderList();
    const token = {};
    state.loading = token;
    thread.setAttribute('aria-busy', 'true');
    // 300ms 内加载完就不显示骨架屏，避免一闪而过
    const sk = setTimeout(() => {
      if (state.loading !== token) return;
      thread.classList.remove('is-empty');
      col.replaceChildren(skeleton());
      updateToBottom();
    }, 300);
    await sleep(flags.slow ? 2600 : 120);
    clearTimeout(sk);
    if (state.loading !== token) return;
    state.loading = null;
    thread.removeAttribute('aria-busy');
    renderThread();
    restoreDraft();
  }
  function newChat() {
    closeNav(false);
    state.loading = null;
    state.activeId = null;
    renderList();
    renderThread();
    restoreDraft();
    ta.focus();
  }
  $('#newChat').addEventListener('click', newChat);

  // 删除先执行，再给撤销，不弹确认框
  function deleteConv(c) {
    if (state.busy && state.busy.conv === c) stopGen();
    const idx = state.convs.indexOf(c);
    const wasActive = c.id === state.activeId;
    state.convs.splice(idx, 1);
    state.queue = state.queue.filter(q => q !== c);
    if (wasActive) { state.activeId = null; renderThread(); restoreDraft(); }
    renderList();
    const next = nav.querySelector('.conv-open');
    (next || $('#newChat')).focus();
    toast('已删除「' + clip(c.title, 12) + '」', {
      action: '撤销',
      onAction: () => {
        state.convs.splice(Math.min(idx, state.convs.length), 0, c);
        if (wasActive) { state.activeId = c.id; renderThread(); restoreDraft(); }
        renderList();
        announce('已恢复对话');
      }
    });
  }

  // ---------- 断网与离线排队 ----------
  async function flushQueue() {
    while (state.queue.length && !state.offline && !state.busy) {
      const conv = state.queue.shift();
      if (!state.convs.includes(conv)) continue;
      for (const x of conv.messages) {
        if (!x.pending) continue;
        x.pending = false;
        const p = x.el && x.el.querySelector('.pending');
        if (p) p.remove();
      }
      await startReply(conv);
    }
  }
  function setOffline(off) {
    if (state.offline === off) return;
    state.offline = off;
    $('#offlineBanner').hidden = !off;
    $('#demoOffline').checked = off;
    announce(off ? '网络已断开' : '网络已恢复');
    if (!off) flushQueue();
  }
  $('#demoOffline').addEventListener('change', e => setOffline(e.target.checked));
  addEventListener('online', () => setOffline(false));
  addEventListener('offline', () => setOffline(true));

  // ---------- 侧栏：拖拽调宽，松手临界阻尼吸附；键盘和按钮都能完成 ----------
  const collapseBtn = $('#collapseBtn');
  let sideW = 260, openW = 260, stopSide = null, dragX = 0, dragW = 0;
  function setSide(w) {
    sideW = w;
    app.style.setProperty('--side-w', Math.round(w) + 'px');
    const collapsed = w < 150;
    sidebar.toggleAttribute('data-collapsed', collapsed);
    resizer.setAttribute('aria-valuenow', String(Math.round(w)));
    collapseBtn.setAttribute('aria-expanded', String(!collapsed));
    collapseBtn.setAttribute('aria-label', collapsed ? '展开侧栏' : '收起侧栏');
  }
  function settleSide(target) {
    if (stopSide) stopSide();
    if (target > 64) openW = target;
    stopSide = spring({ from: sideW, to: target, k: 1200, c: 70, onUpdate: setSide });
  }
  const snap = w => (w < 150 ? 64 : Math.min(360, Math.max(220, w)));
  const toggleSide = () => settleSide(sideW > 64 ? 64 : openW);
  collapseBtn.addEventListener('click', toggleSide);
  resizer.addEventListener('pointerdown', e => {
    if (stopSide) stopSide();
    resizer.setPointerCapture(e.pointerId);
    dragX = e.clientX;
    dragW = sideW;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
  });
  resizer.addEventListener('pointermove', e => {
    if (resizer.hasPointerCapture(e.pointerId)) setSide(Math.max(64, Math.min(400, dragW + e.clientX - dragX)));
  });
  const release = () => {
    if (!resizer.classList.contains('dragging')) return;
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    settleSide(snap(sideW));
  };
  resizer.addEventListener('pointerup', release);
  resizer.addEventListener('pointercancel', release);
  resizer.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'Enter' || k === ' ') toggleSide();
    else if (k === 'ArrowLeft') settleSide(sideW <= 220 ? 64 : Math.max(220, sideW - 16));
    else if (k === 'ArrowRight') settleSide(sideW < 220 ? 220 : Math.min(360, sideW + 16));
    else if (k === 'Home') settleSide(64);
    else if (k === 'End') settleSide(360);
    else return;
    e.preventDefault();
  });

  // ---------- 移动端抽屉 ----------
  function openNav() {
    app.classList.add('nav-open');
    scrim.hidden = false;
    $('#main').inert = true;
    $('#newChat').focus();
  }
  function closeNav(restore = true) {
    if (!app.classList.contains('nav-open')) return;
    app.classList.remove('nav-open');
    scrim.hidden = true;
    $('#main').inert = false;
    if (restore) $('#openNav').focus();
  }
  $('#openNav').addEventListener('click', openNav);
  scrim.addEventListener('click', () => closeNav());
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && app.classList.contains('nav-open')) closeNav(); });
  mobile.addEventListener('change', () => closeNav(false));

  // ---------- 主题 ----------
  const themeBtn = $('#themeBtn');
  const darkMq = matchMedia('(prefers-color-scheme: dark)');
  const THEMES = { system: ['跟随系统', 'monitor'], light: ['浅色', 'sun'], dark: ['深色', 'moon'] };
  let themePref = 'system';
  try { themePref = localStorage.getItem('lumen-theme') || 'system'; } catch (e) {}
  function applyTheme() {
    const dark = themePref === 'dark' || (themePref === 'system' && darkMq.matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    const [label, ic] = THEMES[themePref];
    themeBtn.querySelector('use').setAttribute('href', '#i-' + ic);
    themeBtn.querySelector('.theme-text').textContent = label;
    themeBtn.setAttribute('aria-label', '主题：' + label + '，点击切换');
  }
  themeBtn.addEventListener('click', () => {
    const order = ['system', 'light', 'dark'];
    themePref = order[(order.indexOf(themePref) + 1) % order.length];
    try { localStorage.setItem('lumen-theme', themePref); } catch (e) {}
    applyTheme();
  });
  darkMq.addEventListener('change', applyTheme);

  // ---------- 设置弹窗：显式保存、失焦校验、失败不丢输入、关闭前提醒 ----------
  const dlg = $('#settings'), sform = $('#settingsForm'), saveBtn = $('#saveBtn');
  const fields = { name: $('#fName'), email: $('#fEmail') };
  const RULES = {
    name: v => {
      const n = v.trim().length;
      if (!n) return '请填写显示名称，它会出现在你分享的对话里';
      if (n < 2) return '显示名称至少 2 个字，现在只有 1 个';
      if (n > 20) return '显示名称最多 20 个字，现在有 ' + n + ' 个';
      return '';
    },
    email: v => {
      v = v.trim();
      if (!v) return '';
      if (!v.includes('@')) return '邮箱缺少 @，例如 name@example.com';
      const host = v.split('@')[1] || '';
      if (!host.includes('.') || host.endsWith('.')) return '邮箱域名不完整，例如 name@example.com';
      return '';
    }
  };
  let savedForm = '', opener = null, saving = false;
  const snapshot = () => JSON.stringify(Object.fromEntries(new FormData(sform)));
  const isDirty = () => snapshot() !== savedForm;
  function validate(name) {
    const el = fields[name], msg = RULES[name](el.value), err = $('#' + el.id + 'Err');
    el.setAttribute('aria-invalid', msg ? 'true' : 'false');
    err.hidden = !msg;
    err.replaceChildren(...(msg ? [icon('alert'), msg] : []));
    return !msg;
  }
  function clearErr(name) {
    const el = fields[name];
    el.removeAttribute('aria-invalid');
    delete el.dataset.touched;
    $('#' + el.id + 'Err').hidden = true;
  }
  for (const name in fields) {
    const el = fields[name];
    el.addEventListener('input', () => {
      el.dataset.touched = '1';
      if (el.getAttribute('aria-invalid') === 'true') validate(name);
    });
    el.addEventListener('blur', () => { if (el.dataset.touched) validate(name); });
  }
  function restoreForm(json) {
    const data = JSON.parse(json);
    for (const el of sform.elements) {
      if (!el.name) continue;
      if (el.type === 'checkbox') el.checked = data[el.name] === 'on';
      else if (el.type === 'radio') el.checked = data[el.name] === el.value;
      else el.value = data[el.name] || '';
    }
    for (const name in fields) clearErr(name);
  }
  function showDiscard(on) {
    $('#discardBar').hidden = !on;
    $('#dlgActions').hidden = on;
    if (on) $('#keepEditing').focus();
  }
  function openSettings() {
    opener = mobile.matches ? $('#openNav') : document.activeElement;
    closeNav(false);
    savedForm = snapshot();
    showDiscard(false);
    $('#saveError').hidden = true;
    dlg.showModal();
  }
  function closeDialog() {
    dlg.close();
    if (opener && opener.focus) opener.focus();
  }
  function requestClose() {
    if (saving) return;
    if (isDirty()) showDiscard(true); else closeDialog();
  }
  $('#meBtn').addEventListener('click', openSettings);
  dlg.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', requestClose));
  dlg.addEventListener('click', e => { if (e.target === dlg) requestClose(); });
  dlg.addEventListener('cancel', e => {
    if (!$('#discardBar').hidden) { e.preventDefault(); showDiscard(false); fields.name.focus(); }
    else if (isDirty() || saving) { e.preventDefault(); requestClose(); }
  });
  $('#keepEditing').addEventListener('click', () => { showDiscard(false); fields.name.focus(); });
  $('#discardBtn').addEventListener('click', () => { restoreForm(savedForm); closeDialog(); });
  sform.addEventListener('submit', async e => {
    e.preventDefault();
    if (saving) return;
    const bad = Object.keys(fields).filter(name => !validate(name));
    if (bad.length) {
      fields[bad[0]].focus();
      announce('有 ' + bad.length + ' 处需要修改');
      return;
    }
    if (!isDirty()) { closeDialog(); return; }
    saving = true;
    saveBtn.setAttribute('aria-disabled', 'true');
    $('#saveError').hidden = true;
    const spin = setTimeout(() => saveBtn.replaceChildren(h('span', { class: 'spin', 'aria-hidden': 'true' }), '保存中'), 300);
    await sleep(900);
    clearTimeout(spin);
    saveBtn.replaceChildren('保存设置');
    saveBtn.removeAttribute('aria-disabled');
    saving = false;
    if (flags.fail) {
      consumeFail();
      $('#saveError').hidden = false;
      return;
    }
    savedForm = snapshot();
    const name = fields.name.value.trim();
    $('#meName').textContent = name;
    $('#avatar').textContent = name.slice(0, 1);
    closeDialog();
    toast('设置已保存', { tone: 'success' });
  });
  addEventListener('beforeunload', e => {
    if (dlg.open && isDirty()) { e.preventDefault(); e.returnValue = ''; }
  });

  const phone = $('#phone'), phoneBtn = $('#phoneToggle');
  phoneBtn.addEventListener('click', () => {
    const show = phoneBtn.textContent === '显示';
    phone.textContent = show ? '186 2734 1402' : '186 **** 1402';
    phoneBtn.textContent = show ? '隐藏' : '显示';
  });
  $('#usage').textContent = nf.format(128350) + ' 字';
  $('#cost').textContent = cny.format(1280);
  $('#lastLogin').replaceChildren(h('time', { datetime: new Date(now - 5 * HOUR).toISOString() }, absTime(now - 5 * HOUR)));

  // ---------- 启动 ----------
  applyTheme();
  setSide(260);
  renderList();
  renderThread();
  restoreDraft();
  if (!navigator.onLine) setOffline(true);
  setInterval(renderList, 30e3);
  ta.focus();
})();
</script>
</body>
</html>
